<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="'Dashboard - ' + ${app.empresa()}">Dashboard</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="top"><div class="titulo"><img class="logo-top" th:src="@{/logo.png}" alt="GIMV Parking"><small class="muted">Controle e Gestão de Estacionamento</small></div>
<div><span id="rel" style="color:#8a8a8a;font-size:12px"></span><a th:href="@{/logout}">Sair</a></div></div>
<div class="wrap">
 <div class="cards">
  <div class="card stat"><span class="muted">No pátio agora</span><b id="s_patio">0</b></div>
  <div class="card stat"><span class="muted">Entradas hoje</span><b id="s_ent">0</b></div>
  <div class="card stat"><span class="muted">Saídas hoje</span><b id="s_sai">0</b></div>
  <div class="card stat"><span class="muted">Faturamento hoje</span><b id="s_fat">R$ 0,00</b></div>
 </div>
 <div class="card">
  <div class="bar">
   <select id="f_status"><option value="patio">No pátio</option><option value="todos">Todos (histórico)</option></select>
   <input id="f_busca" placeholder="Buscar placa, motorista ou ticket">
   <span style="flex:1"></span>
   <button class="btn" onclick="document.getElementById('dlgEntrada').showModal()">+ Nova entrada</button>
  </div>
  <div class="scroll"><table><thead><tr><th>Ticket</th><th>Placa</th><th>Motorista</th><th>Entrada</th><th>Saída</th><th>Valor</th><th>Status</th><th>Foto</th><th></th></tr></thead>
  <tbody id="tb"></tbody></table></div>
 </div>
</div>

<dialog id="dlgEntrada"><form id="fEntrada" method="dialog"><h3>Nova entrada</h3>
 <input name="placa" placeholder="Placa (ex.: ABC1D23)" maxlength="8" required>
 <input name="motorista" placeholder="Nome do motorista" required>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn">Registrar</button></div>
</form></dialog>

<dialog id="dlgSaida"><form id="fSaida" method="dialog"><h3>Registrar saída</h3><p id="saidaInfo" class="muted"></p>
 <select name="forma"><option>CREDITO</option><option>DEBITO</option><option>PIX</option><option>DINHEIRO</option></select>
 <input name="valor" type="number" step="0.01" placeholder="Valor (R$) - vazio usa o padrão">
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn">Confirmar</button></div>
</form></dialog>

<script th:inline="none">
const API='/api';let dados=[],saidaId=null;
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const dt=s=>s?new Date(s.replace(' ','T')).toLocaleString('pt-BR'):'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch(API+path,Object.assign({headers:{'Content-Type':'application/json'}},opt));const j=await r.json();if(!r.ok)throw new Error(j.erro||'Erro');return j}
async function carregar(){
  try{
    const t=await api('/tickets?status='+f_status.value);const r=await api('/resumo');
    dados=t.tickets;s_patio.textContent=r.no_patio;s_ent.textContent=r.entradas_hoje;s_sai.textContent=r.saidas_hoje;s_fat.textContent=brl(r.faturamento_hoje);
    rel.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR')+'  ';desenhar();
  }catch(e){rel.textContent='Sem conexão  '}
}
function desenhar(){
  const q=f_busca.value.trim().toLowerCase();
  tb.innerHTML=dados.filter(t=>!q||(t.placa+t.motorista+t.numero).toLowerCase().includes(q)).map(t=>`<tr>
   <td><b>${t.numero}</b></td><td class="placa">${esc(t.placa_fmt)}</td><td>${esc(t.motorista)}</td><td>${dt(t.entrada_em)}</td><td>${dt(t.saida_em)}</td>
   <td>${t.status==='PAGO'?brl(t.valor):'—'}</td><td><span class="pill ${t.status==='PAGO'?'ok':'on'}">${t.status==='PAGO'?'Pago':'No pátio'}</span></td>
   <td>${t.foto_url?`<a href="${t.foto_url}" target="_blank"><img class="thumb" src="${t.foto_url}"></a>`:''}</td>
   <td style="white-space:nowrap"><a class="btn sm sec" target="_blank" href="/ticket?t=${t.token}">Online</a>
   <a class="btn sm sec" target="_blank" href="/imprimir?t=${t.token}">Imprimir</a>
   ${t.status==='ABERTO'?`<button class="btn sm" onclick="abrirSaida(${t.id},'${esc(t.placa_fmt)}')">Saída</button>`:''}</td></tr>`).join('')
   ||'<tr><td colspan="9" class="muted">Nenhum registro.</td></tr>';
}
function abrirSaida(id,placa){saidaId=id;saidaInfo.textContent='Placa '+placa;fSaida.valor.value='';dlgSaida.showModal()}
fEntrada.addEventListener('submit',async e=>{try{
  const t=await api('/tickets',{method:'POST',body:JSON.stringify({placa:fEntrada.placa.value,motorista:fEntrada.motorista.value})});
  fEntrada.reset();carregar();window.open('/imprimir?t='+t.token,'_blank');}catch(x){alert(x.message)}});
fSaida.addEventListener('submit',async e=>{try{
  const b={forma_pagamento:fSaida.forma.value};if(fSaida.valor.value)b.valor=parseFloat(fSaida.valor.value);
  await api('/tickets/'+saidaId+'/saida',{method:'POST',body:JSON.stringify(b)});carregar();}catch(x){alert(x.message)}});
f_status.onchange=carregar;f_busca.oninput=desenhar;
carregar();setInterval(carregar,5000);   // sincroniza com o app Android a cada 5 s
</script></body></html>
